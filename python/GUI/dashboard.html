<!DOCTYPE html>
<html>
    <head>
        <title>Robot GUI</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="titolo">RobotArm</div>
        <form>
            <div class="griglia">
                <div id="base" class="motoreContainer">

                    <label>Base</label>

                    <div class="inputContainer">
                        <svg class="arco" width="200" height="200" viewBox="0 0 100 100">

                            <defs>
                                <linearGradient id="arcoGradiente" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#00FF00" />
                                    <stop offset="50%" stop-color="#FFFF00" />
                                    <stop offset="100%" stop-color="#FF0000" />
                                </linearGradient>
                            </defs>


                            <!-- Cerchio di sfondo opzionale -->
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#eee" stroke-width="11" 
                                stroke-linecap="round" 
                                stroke-dasharray="141.37 282.7" 
                                transform="rotate(-180 50 50)" />
                            
                            <!-- Arco dinamico (90 gradi di ampiezza su una circonferenza di ~282.7) -->
                            <circle id="baseArco" cx="50" cy="50" r="45" fill="none" stroke-width="10"
                                    stroke-dasharray="70.685 282.7"
                                    stroke-linecap="round"
                                    stroke="url(#arcoGradiente)" 
                                    transform="rotate(-180 50 50)" />
                        </svg>
                        <input class="arcoInput" id="baseInput"  type="number" id="arc-input" min="0" max="180" value="90">
                    </div>
                </div>
